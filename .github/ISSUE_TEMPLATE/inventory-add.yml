name: Add an inventory item
description: Request a base game or expansion be added to the public inventory.
title: "[Inventory add]: "
labels: ["inventory:add"]
body:
  - type: markdown
    attributes:
      value: All submitted fields are public. Use shelf labels, never addresses or private information.
  - type: input
    id: bgg-id
    attributes:
      label: BGG ID
      description: The numeric ID from the BoardGameGeek URL. Leave blank for a local-only item.
      placeholder: "68448"
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: Required for a local-only item without a BGG ID.
      placeholder: https://publisher.example/game
  - type: input
    id: game-name
    attributes:
      label: Game name
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Stable slug
      description: Lowercase letters, numbers, and hyphens only.
      placeholder: 7-wonders
    validations:
      required: true
  - type: input
    id: parent-slug
    attributes:
      label: Parent slug
      description: Preferred way to identify the owned base game for an expansion.
  - type: input
    id: parent-bgg-id
    attributes:
      label: Parent BGG ID
      description: Optional alternative to Parent slug.
  - type: dropdown
    id: standalone
    attributes:
      label: Standalone
      description: Can this expansion be played without the base game?
      options: ["No", "Yes"]
      default: 0
  - type: input
    id: edition
    attributes:
      label: Edition
  - type: input
    id: quantity
    attributes:
      label: Quantity
      value: "1"
    validations:
      required: true
  - type: input
    id: shelf
    attributes:
      label: Shelf label
      placeholder: Game Shelf A3
  - type: dropdown
    id: availability
    attributes:
      label: Availability
      options: [available, loaned, incomplete, unavailable]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: learned
    attributes:
      label: Learned
      options: ["No", "Yes"]
      default: 0
  - type: input
    id: house-rating
    attributes:
      label: House rating
      description: Optional rating from 1 to 5.
  - type: dropdown
    id: setup-time-range
    attributes:
      label: Setup time range
      options:
        - under-5
        - 5-10
        - 11-20
        - 21-30
        - 31-45
        - 46-60
        - over-60
  - type: input
    id: teach-difficulty
    attributes:
      label: Teach difficulty
      description: Optional difficulty from 1 to 5.
  - type: input
    id: min-players
    attributes:
      label: Minimum players
      description: Required for a local-only item.
  - type: input
    id: max-players
    attributes:
      label: Maximum players
      description: Required for a local-only item.
  - type: input
    id: min-minutes
    attributes:
      label: Minimum minutes
      description: Required for a local-only item.
  - type: input
    id: max-minutes
    attributes:
      label: Maximum minutes
      description: Required for a local-only item.
  - type: input
    id: min-age
    attributes:
      label: Minimum age
      description: Required for a local-only item.
  - type: input
    id: modes
    attributes:
      label: Modes
      description: "Required for a local-only base game. Separate supported values with semicolons: competitive; cooperative; team; solo."
      placeholder: competitive;team
  - type: textarea
    id: notes
    attributes:
      label: Ownership notes
  - type: textarea
    id: recommendation-notes
    attributes:
      label: Recommendation notes
