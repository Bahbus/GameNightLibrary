name: Request a game
description: Suggest an unowned game for the public wish list.
title: "[Game request]: "
labels: ["wishlist"]
body:
  - type: markdown
    attributes:
      value: Requests are public. Please check the library and open wish list before suggesting a duplicate.
  - type: input
    id: game-name
    attributes:
      label: Game name
      placeholder: The game you would like the group to consider
    validations:
      required: true
  - type: input
    id: game-source
    attributes:
      label: BoardGameGeek ID or source URL
      description: Enter a numeric BGG ID or a complete publisher, crowdfunding, or product URL.
      placeholder: 68448 or https://publisher.example/game
    validations:
      required: true
  - type: textarea
    id: reasons
    attributes:
      label: Why should we consider it?
      description: Tell us what group, mood, mechanics, or experience makes this a good fit.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Other notes
      description: Edition, availability, price observations, or anything else useful.
