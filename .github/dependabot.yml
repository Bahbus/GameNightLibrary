version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TypeScript 7 is not yet supported by the current typescript-eslint release.
    # Keep receiving compatible TypeScript 6 updates until that peer range advances.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Node 26 remains a Current release and is not yet a Vercel Functions runtime.
    # Continue receiving Node 24 image updates until Node 26 is production-ready here.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
